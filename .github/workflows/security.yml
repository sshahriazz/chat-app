# Security CI — runs on every push and PR. Each job is independent so a
# single failure surfaces the specific class of issue (secret leak vs.
# dep CVE vs. broken type) rather than collapsing them all into "CI is
# red". All jobs are non-blocking-by-default (no `required-status-check`
# wiring in the repo settings yet) — flip them to required once the
# baseline is clean.
#
# Every third-party action is pinned to a full commit SHA (with the human
# tag in a trailing comment) — a mutable tag like `@v4` can be re-pointed
# at malicious code by whoever controls the action repo. Bump the SHA +
# comment together when upgrading.
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so gitleaks can scan commits, not just the tree.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: pnpm audit (high+critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No `version:` — action-setup reads `packageManager` in package.json.
      # Specifying both errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--prod` skips dev dependencies; `--audit-level moderate` exits
      # non-zero on moderate advisories and above (CASA/ASVS V10.3 wants
      # a documented process for moderate+, not just high/critical).
      - run: pnpm audit --prod --audit-level moderate

  typecheck-test:
    name: typecheck + unit tests (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chat-app/server exec prisma generate
        env:
          # `prisma generate` doesn't connect; a dummy URL is enough.
          DATABASE_URL: postgresql://x:x@x:5432/x
      - run: pnpm --filter @chat-app/server exec tsc --noEmit
      - run: pnpm --filter @chat-app/server test
        env:
          DATABASE_URL: postgresql://x:x@x:5432/x

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # `p/owasp-top-ten` + `p/javascript` + `p/typescript` is a solid
      # baseline; tune via .semgrep.yml in the repo if/when noise grows.
      - run: semgrep ci --config p/owasp-top-ten --config p/javascript --config p/typescript
        env:
          SEMGREP_TIMEOUT: "120"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Generate a CycloneDX software bill of materials from the repo +
      # lockfile. CASA/ASVS V10.3 evidence: a machine-readable inventory
      # of every dependency and version shipped. Uploaded as a build
      # artifact so it can be attached to the CASA workbook each release.
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  trivy:
    name: trivy (IaC misconfig + fs CVE/secret)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Misconfiguration scan of Dockerfiles + docker-compose (privileged
      # containers, missing cap_drop, root user, etc.). CASA/ASVS V14.
      - name: Trivy config (misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # Filesystem scan: vulnerable OS/lang packages + leaked secrets.
      # Complements gitleaks (git-history) and pnpm audit (prod deps) with
      # a whole-tree view. Add a `.trivyignore` to triage accepted findings.
      - name: Trivy filesystem (vuln + secret)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
